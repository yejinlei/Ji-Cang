<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="vendor/tailwindcss-3.4.17.js"></script>
<script>
tailwind.config={theme:{extend:{
  colors:{paper:'#f7f3ea',paper2:'#efe7d8',paper3:'#e6dcc8',ink:'#1a1612',ink2:'#4a463f',ink3:'#7a736a',cinnabar:'#a8322d',jade:'#2f6b5f',gold:'#b8860b',gold2:'#d4a017',bone:'#f2ecd9'},
  fontFamily:{serif:['Songti SC','STSong','SimSun','serif'],kai:['Kaiti SC','STKaiti','KaiTi','serif'],sans:['PingFang SC','HarmonyOS Sans SC','Microsoft YaHei','sans-serif']}

<style>
body{background:#f7f3ea}
.paper-bg{background-image:radial-gradient(circle at 12% 18%,rgba(168,50,45,.04) 0,transparent 42%),radial-gradient(circle at 88% 8%,rgba(47,107,95,.04) 0,transparent 40%)}
.dark-bg{background:#14100c;background-image:radial-gradient(ellipse at top,#241d16 0,#14100c 60%)}
.tag{display:inline-block;padding:.12rem .5rem;border-radius:.375rem;font-size:.72rem}
.lk{color:#a8322d}.lk:hover{text-decoration:underline}
.cat-card{cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.cat-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px -14px rgba(34,32,29,.35);border-color:#a8322d}
.seal{display:inline-flex;align-items:center;justify-content:center;font-family:'Songti SC',serif;font-weight:700;color:#f7f3ea;background:#a8322d;border-radius:4px}
</style>
</head>
<body class="font-sans text-ink paper-bg min-h-screen">
<header class="sticky top-0 z-50">
  <div class="bg-[#14100c] text-bone/75 border-b border-gold/20 text-[12.5px]">
    <div class="max-w-6xl mx-auto px-4 py-1.5 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 hover:text-gold2 transition-colors">
        <span class="seal w-[20px] h-[20px] text-[11px]">藏</span>
        <span class="tracking-[.3em]">集藏本体论 · JI-CANG ONTOLOGY</span>
      </a>
      <nav class="hidden md:flex items-center gap-4">
        <a href="index.html" class="hover:text-gold2">首页</a>
        <a href="ontology.html" class="hover:text-gold2">本体</a>
        <a href="books.html" class="text-gold2">全文库</a>
        <a href="dict.html" class="hover:text-gold2">文论</a>
        <a href="schools.html" class="hover:text-gold2">流派</a>
        <a href="figures.html" class="hover:text-gold2">文人</a>
      </nav>
    </div>
  </div>
  <div class="bg-[#241d16]/95 backdrop-blur border-b border-gold/15">
    <div class="max-w-6xl mx-auto px-4 py-2 flex items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-2">
        <span class="seal w-[32px] h-[32px] text-[16px]">文</span>
        <div class="leading-tight"><div class="font-serif font-bold text-bone text-[16px] tracking-wide">全藏原典</div><div class="text-[10px] tracking-widest text-gold2/80">QUAN-CANG · 全 部 典 籍</div></div>
      </a>
      <nav class="flex items-center gap-3 text-bone/90 text-[14px]">
        <a href="index.html" class="hover:text-gold2 font-serif">☰ 总览</a>
        <a href="ontology.html" class="hover:text-gold2 font-serif">⬡ 本体</a>
        <a href="books.html" class="text-gold2 font-serif">書 全文库</a>
      </nav>
    </div>
  </div>
</header>
<main class="max-w-6xl mx-auto px-4 py-8">
  <div class="flex items-end justify-between flex-wrap gap-3">
    <div>
      <p class="text-cinnabar font-serif tracking-[.3em] text-[12px] mb-1">籍 QUAN-CANG · 原 典 全 文</p>
      <h1 class="font-serif font-bold text-[28px] md:text-[34px] text-ink">集藏原典库</h1>
      <p class="text-ink2 text-[14.5px] mt-2 max-w-2xl leading-relaxed">殆知阁集藏全部典籍，按九类编次。<span id="tot" class="text-cinnabar font-semibold"></span>全部典籍已嵌入本站，点击「📖 站内阅读」即可在线阅览。</p>
    </div>
    <input id="q" type="search" placeholder="检索书名 / 著者…" class="w-full sm:w-72 px-3 py-2 rounded-md border border-ink/20 bg-white/80 text-[14px] focus:outline-none focus:border-cinnabar">
  </div>
  <div id="tabs" class="flex flex-wrap gap-2 text-[13px] mt-4"></div>
  <div id="meta" class="text-[13px] text-ink3 mt-3 mb-3"></div>
  <div id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3"></div>
  <div id="backBtn" style="display:none" class="mt-4"><button id="back" class="px-4 py-1.5 rounded-md border border-ink/25 text-ink text-[13px] hover:border-cinnabar hover:text-cinnabar">← 返回分类总览</button></div>
  <div id="moreWrap" class="text-center mt-6" style="display:none"><button id="more" class="px-6 py-2 rounded-md border border-ink/25 text-ink text-[14px] hover:border-cinnabar hover:text-cinnabar">加载更多</button></div>
</main>
<script src="data/books.js"></script>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;};
const BOOKS=window.JICANG_BOOKS||[];
const CAT_MAP={baojuan:'宝卷',huaben:'话本',miyu:'谜语',sikubieji:'四库别集',wenping:'诗文评',wenzongji:'文宗集',xiaohua:'笑话',xiaoshuo:'小说',yanyi:'演义'};
const CAT_ORDER=['sikubieji','wenzongji','wenping','xiaoshuo','yanyi','huaben','baojuan','xiaohua','miyu'];
const CAT_TRIGRAM={sikubieji:'別',wenzongji:'總',wenping:'評',xiaoshuo:'說',yanyi:'演',huaben:'話',baojuan:'卷',xiaohua:'笑',miyu:'謎'};
const CAT_COLOR={sikubieji:'#a8322d',wenzongji:'#2f6b5f',wenping:'#b8860b',xiaoshuo:'#6b3fa0',yanyi:'#31427b',huaben:'#b5651d',baojuan:'#8b2f2f',xiaohua:'#8b6f47',miyu:'#7a736a'};
const group={};
BOOKS.forEach(b=>{const k=b.cat_key||'other';(group[k]=group[k]||[]).push(b);});
const cats=CAT_ORDER.filter(k=>group[k]);
const palette=['#a8322d','#2f6b5f','#b8860b','#6b3fa0','#31427b','#b5651d','#4a8b7d','#c0524b','#7a736a'];
const tabs=document.querySelector('#tabs'),grid=document.querySelector('#grid'),meta=document.querySelector('#meta'),moreWrap=document.querySelector('#moreWrap');
const backBtn=document.querySelector('#backBtn');
let cur='__overview',kw='',shown=0,list=[];const PAGE=60;
document.querySelector('#tot').textContent=`共 ${BOOKS.length} 部。`;
function overview(){
  grid.innerHTML='';moreWrap.style.display='none';backBtn.style.display='none';
  meta.textContent='按类浏览：点击下方分类查看典籍清单。';
  cats.forEach((c,i)=>{
    const n=(group[c]||[]).length;
    const samples=(group[c]||[]).slice(0,3).map(b=>esc(b.title||b.id)).join('、');
    const card=el(`<div class="cat-card rounded-xl bg-white/72 border border-ink/10 p-4">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
          <span class="font-serif font-bold text-[32px] leading-none" style="color:${CAT_COLOR[c]}">${CAT_TRIGRAM[c]||'書'}</span>
          <div>
            <h2 class="font-serif font-bold text-[17px] text-ink">${esc(CAT_MAP[c]||c)}</h2>
            <div class="text-[11.5px] text-ink3 tracking-wider">${esc(c)}</div>
          </div>
        </div>
        <span class="text-[22px] font-serif font-bold" style="color:${palette[i]}">${n}</span>
      </div>
      <p class="text-[12.5px] text-ink3 mt-2 truncate">${samples}…</p>
    </div>`);
    card.addEventListener('click',()=>{selectCat(c);});
    grid.appendChild(card);
  });
}
function selectCat(c){
  cur=c;build();render(true);
  [...tabs.children].forEach(x=>{x.className='px-3 py-1.5 rounded-md border border-ink/25 text-ink hover:border-cinnabar';});
  const btn=tabs.querySelector(`[data-cat="${c.replace(/"/g,'\\"')}"]`);
  if(btn) btn.className='px-3 py-1.5 rounded-md border bg-ink text-bone border-ink';
  backBtn.style.display='block';
}
function build(){
  list=(group[cur]||[]).filter(b=>{
    if(!kw)return true;
    const au=(b.authors||[]).map(x=>x.name).join(',');
    return (b.title||b.id||'').includes(kw)||au.includes(kw);
  });
}
function render(reset){
  if(reset){grid.innerHTML='';shown=0;}
  list.slice(shown,shown+PAGE).forEach(b=>{
    const f=b.file||`texts/${b.cat_key}/${b.id}.js`;
    const href=`reader.html?f=${encodeURIComponent(f.replace(/^texts\//,''))}`;
    const au=(b.authors||[]).map(a=>a.dynasty?'['+a.dynasty+'] '+a.name:a.name).join('、');
    const src=`<a class="lk text-[12px]" href="${esc(href)}">📖 站内阅读</a>`;
    grid.appendChild(el(`<article class="rounded-lg bg-white/72 border border-ink/10 p-3 hover:border-cinnabar transition-colors">
      <div class="flex items-start justify-between gap-2">
        <h2 class="font-serif font-semibold text-[15px] text-ink leading-snug">${esc(b.title||b.id)}</h2>
        <span class="tag bg-paper3 text-ink3 shrink-0">${esc(b.dynasty||'')}</span>
      </div>
      <div class="text-[12px] text-ink3 mt-1 truncate">${au||'佚名 / 未详'}</div>
      <div class="mt-1.5">${src}</div>
    </article>`));
  });
  shown+=Math.min(list.length-shown,PAGE);
  meta.textContent=`「${CAT_MAP[cur]||cur}」共 ${list.length} 部，已显示 ${shown} 部。`;
  moreWrap.style.display=shown>=list.length?'none':'block';
}
cats.forEach(c=>{
  const n=(group[c]||[]).length;
  const b=el(`<button data-cat="${esc(c)}" class="px-3 py-1.5 rounded-md border border-ink/25 text-ink hover:border-cinnabar hover:text-cinnabar">${esc(CAT_MAP[c]||c)} <span class="opacity-70">${n}</span></button>`);
  b.addEventListener('click',()=>selectCat(c));
  tabs.appendChild(b);
});
document.querySelector('#q').addEventListener('input',e=>{
  kw=e.target.value.trim();
  if(kw&&cur==='__overview') selectCat(cats[0]);
  build();render(true);
});
document.querySelector('#more').addEventListener('click',()=>render(false));
document.querySelector('#back').addEventListener('click',overview);
overview();
</script>
</body>
</html>
