<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="js/theme-init.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>典籍阅读 · 集藏本体论</title>
  <link rel="stylesheet" href="css/yijing.css">
  <script src="js/echarts.min.js"></script>
  <script src="data/books.js"></script>
  <script src="data/individuals.js"></script>
  <script src="js/shell.js"></script>
  <style>
    .page-hero{
      text-align:center;padding:48px 20px 36px;
      background:radial-gradient(ellipse 800px 400px at 50% 40%, rgba(40,70,130,.25) 0%, transparent 70%),
                 linear-gradient(180deg,rgba(8,16,32,.4) 0%, transparent 100%);
      border-bottom:1px solid var(--line);
    }
    .page-hero h1{font-size:38px;color:var(--ink);letter-spacing:8px;margin:0 0 6px;}
    .page-hero h1 .accent{color:var(--zhu);}
    .page-hero .sub{color:var(--gold);letter-spacing:4px;font-size:14px;}
    .search-bar{
      max-width:560px;margin:20px auto 0;position:relative;
    }
    .search-bar input{
      width:100%;padding:10px 16px;border-radius:var(--radius);
      background:rgba(255,255,255,.05);border:1px solid var(--line-strong);
      color:var(--ink);font-family:var(--font-serif);font-size:15px;letter-spacing:2px;
      outline:none;
    }
    .search-bar input::placeholder{color:var(--ink-3);letter-spacing:2px;}
    .search-bar input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,176,121,.15);}

    .filter-row{
      display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0 20px;
    }
    .filter-row button{
      background:rgba(255,255,255,.04);border:1px solid var(--line);
      padding:6px 14px;border-radius:20px;cursor:pointer;font-family:var(--font-serif);
      font-size:13px;letter-spacing:2px;color:var(--ink-2);transition:all .2s;
    }
    .filter-row button:hover{border-color:var(--gold);color:var(--gold-bright);}
    .filter-row button.on{background:var(--zhu);color:#fff;border-color:var(--zhu);}

    .book-grid{
      display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;
    }
    .book-card{
      background:var(--space-card);border:1px solid var(--line);border-radius:var(--radius-lg);
      padding:16px 18px;text-decoration:none;color:inherit;transition:all .25s;
      backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:6px;
      border-left:3px solid var(--zhu);
    }
    .book-card:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:var(--shadow-lg);}
    .book-card.zongji{border-left-color:var(--gold);}
    .book-card.wenping{border-left-color:var(--jade);}
    .book-card.xiaoshuo{border-left-color:var(--ice);}
    .book-card.yanyi{border-left-color:var(--violet);}
    .book-card.huaben{border-left-color:var(--amber);}
    .book-card.baojuan{border-left-color:var(--silver);}
    .book-card.xiaohua{border-left-color:var(--zhu-soft);}
    .book-card.miyu{border-left-color:#8c6b2f;}
    .book-card .title{font-size:16px;color:var(--ink);letter-spacing:2px;font-weight:600;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .book-card .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);letter-spacing:1px;}
    .book-card .author{font-size:12px;color:var(--gold);letter-spacing:1px;}
    .book-card .badge{
      display:inline-block;padding:1px 8px;border-radius:10px;font-size:10px;letter-spacing:1px;
      background:rgba(212,176,121,.1);border:1px solid rgba(212,176,121,.25);color:var(--gold);
    }

    .reader-panel{
      display:none;margin-top:24px;
    }
    .reader-panel.active{display:block;}
    .reader-header{
      background:var(--space-card);border:1px solid var(--line);border-radius:var(--radius-lg);
      padding:22px 28px;margin-bottom:18px;backdrop-filter:blur(6px);
      border-left:4px solid var(--zhu);
    }
    .reader-header h2{margin:0 0 6px;font-size:28px;color:var(--zhu);letter-spacing:6px;}
    .reader-header .meta{color:var(--ink-3);font-size:13px;letter-spacing:2px;}
    .reader-body{
      background:var(--space-card);border:1px solid var(--line);border-radius:var(--radius-lg);
      padding:28px 36px;backdrop-filter:blur(6px);max-height:70vh;overflow-y:auto;
      font-family:var(--font-kai);font-size:17px;line-height:2.2;color:var(--ink-2);
      letter-spacing:1px;
    }
    .reader-body h3{color:var(--gold);font-size:18px;letter-spacing:3px;margin:18px 0 8px;border-bottom:1px dashed var(--line);padding-bottom:6px;}
    .reader-body p{margin:0 0 4px;text-indent:2em;}
    .back-btn{
      display:inline-block;padding:6px 14px;border-radius:4px;background:rgba(212,176,121,.1);
      border:1px solid var(--line-strong);color:var(--gold);font-size:13px;letter-spacing:2px;
      cursor:pointer;margin-bottom:14px;text-decoration:none;
    }
    .back-btn:hover{background:rgba(212,176,121,.22);color:var(--gold-bright);}

    .empty-hint{text-align:center;padding:40px;color:var(--ink-3);letter-spacing:2px;font-size:14px;}
    @media (max-width:768px){
      .page-hero h1{font-size:28px;letter-spacing:4px;}
      .book-grid{grid-template-columns:repeat(2,1fr);gap:8px;}
      .reader-body{padding:20px 18px;font-size:15px;}
    }
  </style>
</head>
<body>
<div id="topbar-slot"></div>
<div class="layout">
  <div id="sidebar-slot"></div>
  <main class="content" style="padding:0;">
    <section class="page-hero">
      <h1>典<span class="accent">籍</span>阅读</h1>
      <div class="sub">JI-BU WENXIAN · 集 部 全 藏</div>
      <div class="search-bar">
        <input id="searchInput" type="text" placeholder="检索书名、著者、朝代…" />
      </div>
    </section>

    <div style="padding:24px var(--gutter,40px) 60px;max-width:1200px;margin:0 auto;width:100%;">
      <div class="filter-row" id="filterRow"></div>

      <div id="readerPanel" class="reader-panel">
        <a class="back-btn" href="javascript:closeReader()">← 返回典籍列表</a>
        <div class="reader-header">
          <h2 id="readerTitle"></h2>
          <div class="meta" id="readerMeta"></div>
        </div>
        <div class="reader-body" id="readerBody">正在加载…</div>
      </div>

      <div id="listPanel">
        <div class="book-grid" id="bookGrid"></div>
        <div class="empty-hint" id="emptyHint" style="display:none;">未找到匹配典籍</div>
      </div>
    </div>
  </main>
</div>
<div id="footer-slot"></div>

<script>
document.getElementById('topbar-slot').innerHTML = JC_Link.topbar('books');
document.getElementById('sidebar-slot').innerHTML = JC_Link.sidebar('books');
document.getElementById('footer-slot').innerHTML = JC_Link.footer();
JC_Link.initMobile();

var BOOKS = Array.isArray(window.JICANG_BOOKS) ? window.JICANG_BOOKS : [];
var keyMap = {sikubieji:'bieji',bieji:'bieji',siku_zongji:'zongji',wenzongji:'zongji',zongji:'zongji',
  siku_shiwenping:'wenping',wenping:'wenping',shiwenping:'wenping',
  siku_xiaoshuo:'xiaoshuo',xiaoshuo:'xiaoshuo',yanyi:'yanyi',huaben:'huaben',
  baojuan:'baojuan',xiaohua:'xiaohua',miyu:'miyu'};
var catName = {bieji:'别集',zongji:'总集',wenping:'文评',xiaoshuo:'小说',yanyi:'演义',huaben:'话本',baojuan:'宝卷',xiaohua:'笑话',miyu:'谜语'};
var catOrder = ['all','bieji','zongji','wenping','xiaoshuo','yanyi','huaben','baojuan','xiaohua','miyu'];
var catLabel = {all:'全部',bieji:'别集',zongji:'总集',wenping:'文评',xiaoshuo:'小说',yanyi:'演义',huaben:'话本',baojuan:'宝卷',xiaohua:'笑话',miyu:'谜语'};
var curCat = 'all';
var curKw = '';

// 分类过滤按钮
var fr = document.getElementById('filterRow');
fr.innerHTML = catOrder.map(function(c){
  return '<button data-cat="'+c+'" class="'+(c==='all'?'on':'')+'">'+catLabel[c]+'</button>';
}).join('');
fr.addEventListener('click',function(e){
  if(e.target.tagName!=='BUTTON') return;
  fr.querySelectorAll('button').forEach(function(b){b.classList.remove('on');});
  e.target.classList.add('on');
  curCat = e.target.dataset.cat;
  renderList();
});

document.getElementById('searchInput').addEventListener('input',function(e){
  curKw = e.target.value.trim().toLowerCase();
  renderList();
});

function renderList(){
  var grid = document.getElementById('bookGrid');
  var hint = document.getElementById('emptyHint');
  var list = BOOKS.filter(function(b){
    var k = keyMap[b.cat_key||b.category];
    if(curCat!=='all' && k!==curCat) return false;
    if(curKw){
      var s = (b.title+' '+(b.authors||[]).map(function(a){return a.name||a;}).join(' ')+' '+(b.dynasty||'')).toLowerCase();
      if(s.indexOf(curKw)<0) return false;
    }
    return true;
  }).slice(0,500); // 防止一次渲染太多
  if(!list.length){ grid.innerHTML=''; hint.style.display='block'; return; }
  hint.style.display='none';
  grid.innerHTML = list.map(function(b){
    var k = keyMap[b.cat_key||b.category]||'bieji';
    var auth = b.authors && b.authors[0] ? (b.authors[0].name||b.authors[0]) : '佚名';
    var dyn = b.dynasty || '';
    return '<a href="javascript:openReader(\''+b.id.replace(/'/g,"\\'")+'\')" class="book-card '+k+'">'+
      '<div class="title">'+b.title+'</div>'+
      '<div class="author">'+(dyn?'['+dyn+'] ':'')+auth+'</div>'+
      '<div class="meta"><span class="badge">'+(catName[k]||'典籍')+'</span>'+
        '<span>'+Math.round((b.chars||b.size||0)/10000)/10+'万字</span></div>'+
    '</a>';
  }).join('');
}
renderList();

// === 阅读面板 ===
var loadedTexts = {};
function openReader(bid){
  var book = BOOKS.find(function(b){return b.id===bid;});
  if(!book) return;
  document.getElementById('listPanel').style.display='none';
  var rp = document.getElementById('readerPanel');
  rp.classList.add('active');
  document.getElementById('readerTitle').textContent = book.title;
  var auth = book.authors && book.authors[0] ? (book.authors[0].name||book.authors[0]) : '佚名';
  document.getElementById('readerMeta').textContent = (book.dynasty?book.dynasty+' · ':'') + auth + ' · ' + (catName[keyMap[book.cat_key||book.category]]||'典籍');
  document.getElementById('readerBody').innerHTML = '正在加载原文…';
  loadAndRender(book);
  window.scrollTo({top:0,behavior:'smooth'});
}
function closeReader(){
  document.getElementById('readerPanel').classList.remove('active');
  document.getElementById('listPanel').style.display='';
}
function loadAndRender(book){
  var key = book.file;
  if(loadedTexts[key]){ renderBook(book, loadedTexts[key]); return; }
  var s=document.createElement('script');
  s.src = key;
  s.onload = function(){
    // 约定：text 文件定义 window.JICANG_TEXT
    var txt = window.JICANG_TEXT || window.TEXT || window.CURRENT_TEXT || '';
    loadedTexts[key] = txt;
    renderBook(book, txt);
  };
  s.onerror = function(){
    document.getElementById('readerBody').innerHTML = '<p style="color:var(--zhu);">原文加载失败：'+key+'</p>';
  };
  document.head.appendChild(s);
}
function renderBook(book, txt){
  if(!txt){ document.getElementById('readerBody').innerHTML = '<p>暂无原文。</p>'; return; }
  // txt 可能是字符串或对象 {title, content/juan/...}
  var html = '';
  if(typeof txt === 'string'){
    html = txt.split(/\n/).map(function(l){return l.trim()?'<p>'+escapeHtml(l)+'</p>':'';}).join('');
  } else {
    if(txt.title) html += '<h3>'+escapeHtml(txt.title)+'</h3>';
    var c = txt.content || txt.text || txt.body;
    if(c){
      if(Array.isArray(c)){
        c.forEach(function(j){
          if(typeof j==='string'){html += '<p>'+escapeHtml(j)+'</p>';}
          else {
            if(j.title) html += '<h3>'+escapeHtml(j.title)+'</h3>';
            var jc = j.content||j.text||'';
            if(Array.isArray(jc)) jc=jc.join('\n');
            html += (jc||'').split(/\n/).map(function(l){return l.trim()?'<p>'+escapeHtml(l)+'</p>':'';}).join('');
          }
        });
      } else {
        html += String(c).split(/\n/).map(function(l){return l.trim()?'<p>'+escapeHtml(l)+'</p>':'';}).join('');
      }
    }
  }
  document.getElementById('readerBody').innerHTML = html || '<p style="color:var(--ink-3);">原文数据格式暂不支持渲染。</p>';
}
function escapeHtml(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

// 支持 hash 直接定位分类
if(location.hash){
  var h = location.hash.slice(1);
  if(catName[h]){
    curCat = h;
    fr.querySelectorAll('button').forEach(function(b){b.classList.toggle('on', b.dataset.cat===h);});
    renderList();
  }
}
</script>
</body>
</html>
