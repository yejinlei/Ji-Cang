<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="js/theme-init.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>本体总纲 · 集藏本体论</title>
  <link rel="stylesheet" href="css/yijing.css">
  <script src="js/echarts.min.js"></script>
  <script src="data/ontology.js"></script>
  <script src="data/books.js"></script>
  <script src="js/shell.js"></script>
  <style>
    .page-hero{text-align:center;padding:48px 20px 36px;border-bottom:1px solid var(--line);
      background:radial-gradient(ellipse 800px 400px at 50% 40%, rgba(40,70,130,.25) 0%, transparent 70%);}
    .page-hero h1{font-size:38px;color:var(--ink);letter-spacing:8px;margin:0 0 6px;}
    .page-hero h1 .accent{color:var(--zhu);}
    .page-hero .sub{color:var(--gold);letter-spacing:4px;font-size:14px;}
    .class-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
    .class-card{background:var(--space-card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;border-left:3px solid var(--zhu);}
    .class-card h3{margin:0 0 6px;color:var(--gold-bright);letter-spacing:3px;font-size:18px;}
    .class-card .cls{color:var(--ink-3);font-size:12px;letter-spacing:1px;font-family:var(--font-sans);margin-bottom:10px;}
    .class-card p{color:var(--ink-2);font-size:13px;line-height:1.8;margin:0;}
    @media(max-width:768px){.class-grid{grid-template-columns:1fr;}.page-hero h1{font-size:28px;}}
  </style>
</head>
<body>
<div id="topbar-slot"></div>
<div class="layout">
  <div id="sidebar-slot"></div>
  <main class="content" style="padding:0;">
    <section class="page-hero">
      <h1>本<span class="accent">体</span>总纲</h1>
      <div class="sub">ONTOLOGY · TBox 类 体 系 · 七 层 架 构</div>
    </section>
    <div style="padding:28px var(--gutter,40px) 60px;max-width:1200px;margin:0 auto;width:100%;">

      <section class="section">
        <div class="section-title"><span class="icon">☰</span>本体层级（七层）</div>
        <p style="color:var(--ink-2);line-height:1.9;font-size:14px;">集藏本体自元模型以至文化外延共分七层，层层细化，下学上达。</p>
        <div class="ont-level" id="levelsBox" style="grid-template-columns:repeat(7,1fr);"></div>
      </section>

      <section class="section">
        <div class="section-title"><span class="icon">類</span>核心类（Classes）</div>
        <div class="class-grid" id="classGrid"></div>
      </section>

      <section class="section">
        <div class="section-title"><span class="icon">綱</span>关系与公理</div>
        <p style="color:var(--ink-2);font-size:14px;line-height:2;">
          核心对象属性：<span style="color:var(--gold);">著述(authorOf)</span>、<span style="color:var(--gold);">收于(partOf)</span>、
          <span style="color:var(--gold);">属于流派(schoolOf)</span>、<span style="color:var(--gold);">使用意象(usesImagery)</span>、
          <span style="color:var(--gold);">主情(expressesEmotion)</span>、<span style="color:var(--gold);">承继(inherits)</span>、
          <span style="color:var(--gold);">作于(datedTo)</span>。
        </p>
        <div class="quote">
          "诗者，志之所之也，在心为志，发言为诗。"
          <span class="src">—— 《毛诗序》</span>
        </div>
      </section>

    </div>
  </main>
</div>
<div id="footer-slot"></div>
<script>
document.getElementById('topbar-slot').innerHTML = JC_Link.topbar('ontology');
document.getElementById('sidebar-slot').innerHTML = JC_Link.sidebar('layers');
document.getElementById('footer-slot').innerHTML = JC_Link.footer();
JC_Link.initMobile();

var LAYERS = [
  {no:'L1',name:'元模型',  desc:'文/道/气'},
  {no:'L2',name:'域类',    desc:'集部九类'},
  {no:'L3',name:'典籍',    desc:'具体文献'},
  {no:'L4',name:'卷篇',    desc:'篇章结构'},
  {no:'L5',name:'文论',    desc:'文论术语'},
  {no:'L6',name:'文象',    desc:'意象情感'},
  {no:'L7',name:'文化',    desc:'外延语境'}
];
document.getElementById('levelsBox').innerHTML = LAYERS.map(function(l){
  return '<div class="ont-lvl"><div class="lv-num">'+l.no+'</div><div class="lv-name">'+l.name+'</div><div class="lv-desc">'+l.desc+'</div></div>';
}).join('');

var CLASSES = [
  {name:'Work（典籍作品）',cls:'L3',desc:'集部独立著作单元，如《李太白集》《红楼梦》。核心属性：title、dynasty、chars、category。'},
  {name:'Person（著者人物）',cls:'L3',desc:'集部文献作者，含姓名、朝代、字号、所属流派等。'},
  {name:'Chapter（卷篇）',cls:'L4',desc:'典籍内部卷、回、篇、章的结构单元，承载具体文本。'},
  {name:'School（流派）',cls:'L5',desc:'文学流派，如建安七子、江西诗派、唐宋派、桐城派等。'},
  {name:'Imagery（意象）',cls:'L6',desc:'文学意象——月、柳、梅、雁、酒、剑等承载文化情感的象征单元。'},
  {name:'TheoryTerm（文论术语）',cls:'L5',desc:'文论范畴——气、风骨、神韵、格调、性灵、肌理等。'},
  {name:'Emotion（情感）',cls:'L6',desc:'作品所抒发的主要情志类别：忧国、思归、别情、咏史、山水等。'},
  {name:'Dynasty（朝代）',cls:'L7',desc:'时代语境，汉魏唐宋元明清民国等，作品与人物均依附于朝代。'},
  {name:'CulturalContext（文化外延）',cls:'L7',desc:'历史事件、科举制度、宗教思潮、地理空间等外部语境。'}
];
document.getElementById('classGrid').innerHTML = CLASSES.map(function(c){
  return '<div class="class-card"><h3>'+c.name+'</h3><div class="cls">'+c.cls+'</div><p>'+c.desc+'</p></div>';
}).join('');
</script>
</body>
</html>
